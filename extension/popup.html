<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Silverback</title>
<style>
  :root { --bg: #0D1117; --card: #161B22; --line: #21262D; --edge: #30363D; --fg: #E6EDF3; --muted: #9AA4B2; --dim: #6E7681;
    --accent: #4C8DFF; --redo: #D07A2A; --link: #8AB4FF; --ok: #56D364; color-scheme: dark; }
  body { margin: 0; width: 400px; height: 600px; background: var(--bg); color: var(--fg); font: 13px Inter, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  a { color: var(--fg); text-decoration: none; } a:hover { color: var(--link); text-decoration: underline; }
  button, select, input { font: inherit; color: var(--fg); }
  .mono { font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace; }
  .muted { color: var(--muted); }
  header { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .name { font-size: 15px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .where { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  #period { background: transparent; border: 0; font-size: 11px; font-weight: 600; padding: 2px 0; cursor: pointer; }
  #period option { background: var(--card); }
  .spacer { flex: 1 1 auto; }
  .ib { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--edge); border-radius: 8px; cursor: pointer; }
  .ib:hover { background: var(--line); }

  .hero { display: flex; align-items: center; gap: 16px; padding: 16px 16px 14px; }
  .lockup { position: relative; width: 96px; height: 100px; flex: none; }
  .lockup .pin { position: absolute; right: 0; bottom: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 16px 14px; }
  .mini > div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .mini .mono { font-size: 20px; font-weight: 600; } .mini .muted { font-size: 11px; }
  .list { padding: 0 16px; display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .list-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 0 4px; }
  .list-head b { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .item:hover { background: #1A2029; text-decoration: none; color: var(--fg); }
  .item .t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  footer { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); margin-top: 10px; }
  .open { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; background: var(--accent); color: var(--bg); border-radius: 8px; font-weight: 700; }
  .open:hover { color: var(--bg); text-decoration: none; filter: brightness(1.1); }
  .error { color: #E3B341; font-size: 11px; padding: 0 16px; }

  /* Light refresh: thin running bar, spinning icon, content dimmed */
  @keyframes sb-slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(250%) } }
  @keyframes sb-spin { to { transform: rotate(360deg) } }
  .runner { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; background: #172A4A; display: none; }
  .runner div { position: absolute; top: 0; bottom: 0; width: 40%; background: var(--accent); border-radius: 999px; animation: sb-slide 1.1s ease-in-out infinite; }
  body.busy .runner { display: block; } body.busy #refresh svg { animation: sb-spin .9s linear infinite; }
  #view { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; transition: opacity .25s; } body.busy #view { opacity: .55; }
  @media (prefers-reduced-motion: reduce) { .runner div { animation: none; left: 0; width: 100%; opacity: .6; } body.busy #refresh svg { animation: none; } }

  #setup { padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  form { display: flex; flex-direction: column; gap: 10px; }
  label { font-weight: 600; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
  input, form select { min-height: 34px; padding: 0 10px; background: var(--card); border: 1px solid var(--edge); border-radius: 8px; font-weight: 400; }
  .primary { min-height: 36px; background: var(--accent); color: var(--bg); font-weight: 700; border: 0; border-radius: 8px; cursor: pointer; }
  .privacy { font-size: 11px; line-height: 1.5; margin: 0; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .crest-btn { background: none; border: 0; padding: 0; cursor: help; line-height: 0; }
  dialog.explain { width: 340px; max-height: 540px; box-sizing: border-box; background: var(--card); color: var(--fg); border: 1px solid var(--edge); border-radius: 12px; padding: 18px; line-height: 1.5; font-size: 12px; }
  dialog.explain::backdrop { background: rgba(13, 17, 23, .7); }
  dialog.explain p { color: #C9D1D9; margin: 8px 0; } dialog.explain h2 { font-size: 16px !important; }
  .tier-list { list-style: none; padding: 0; margin: 10px 0 14px; display: grid; gap: 8px; }
  .tier-list li { display: flex; align-items: center; gap: 10px; } .tier-list li > span { display: flex; flex-direction: column; line-height: 1.3; }
  .explain-close { min-height: 34px; width: 100%; background: var(--accent); color: var(--bg); font-weight: 700; border: 0; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <img src="icons/icon-32.png" width="26" height="26" alt="">
  <div>
    <div class="name">Silverback</div>
    <div class="where"><span id="where">Ship like you mean it.</span><span id="sep" hidden>·</span>
      <label for="period" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Period</label><select id="period" hidden></select></div>
  </div>
  <div class="spacer"></div>
  <button class="ib" id="refresh" type="button" aria-label="Refresh" title="Refresh"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  <button class="ib" id="gear" type="button" aria-label="Settings" title="Settings"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <div class="runner" aria-hidden="true"><div></div></div>
</header>

<div id="view" aria-live="polite" hidden></div>

<div id="setup" hidden>
  <form id="form">
    <label>GitHub personal access token<input name="token" type="password" autocomplete="off" placeholder="github_pat_… or ghp_…"></label>
    <label>Organization<select name="org" disabled><option>Paste a token first</option></select></label>
    <label>Repository<select name="repo" disabled></select></label>
    <button class="primary">Save</button>
    <p id="setup-error" class="error" style="padding:0" hidden></p>
  </form>
  <p class="privacy muted">No data is collected: there is no server and no database. Your token and stats stay in this browser (never synced),
    which talks to GitHub directly. Needs read access to Metadata, Pull requests, Issues and Projects.</p>
</div>

<footer><span id="updated" class="muted" style="font-size:11px"></span><div class="spacer"></div>
  <a class="open" href="https://alessandro-schmidt.github.io/Silverback-Dashboard/" target="_blank" rel="noopener">Open dashboard
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></a></footer>
<dialog id="explain" class="explain" aria-label="What is the Silverback rate?"></dialog>
<script type="module" src="popup.js"></script>
</body>
</html>
