<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root { --bg: #0D1117; --card: #161B22; --well: #11161D; --line: #21262D; --edge: #30363D; --fg: #E6EDF3; --muted: #9AA4B2; --dim: #6E7681;
    --accent: #4C8DFF; --redo: #D07A2A; --link: #8AB4FF; --ok: #56D364; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px Inter, system-ui, sans-serif; }
  a { color: var(--fg); text-decoration: none; } a:hover { color: var(--link); text-decoration: underline; }
  button, select, input { font: inherit; color: var(--fg); }
  h1, h2 { margin: 0; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .muted { color: var(--muted); }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 0 32px; box-sizing: border-box; }
  @media (max-width: 600px) { .wrap { padding: 0 16px; } }
  .ctl { min-height: 40px; padding: 0 12px; background: var(--card); border: 1px solid var(--edge); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; min-width: 0; }
  .label { color: var(--muted); font-size: 13px; font-weight: 500; }
  .big { font-size: 36px; font-weight: 600; line-height: 1.2; margin-top: 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--line); color: #B1BAC4; }
  .chip.open { background: #12301D; color: var(--ok); }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  .meter { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .meter div { height: 100%; background: var(--accent); border-radius: 999px; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--edge); border-radius: 4px; padding: 1px 6px; align-self: flex-start; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: #B1BAC4; } .legend span { display: flex; align-items: center; gap: 6px; }
  .section-title { font-size: 16px; font-weight: 600; }
  .caps { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px; }

  header { border-bottom: 1px solid var(--line); }
  header .wrap { padding-top: 14px; padding-bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .picker { position: relative; }
  .picker summary { list-style: none; } .picker summary::-webkit-details-marker { display: none; }
  .menu { position: absolute; z-index: 3; top: calc(100% + 6px); left: 0; display: grid; gap: 2px; padding: 4px; min-width: 220px; max-width: calc(100vw - 32px);
    max-height: 50vh; overflow: auto; background: var(--card); border: 1px solid var(--edge); border-radius: 10px; box-shadow: 0 8px 24px #0008; }
  .menu button { display: flex; align-items: center; gap: 8px; padding: 8px; background: none; border: 0; border-radius: 6px; text-align: left; cursor: pointer; }
  .menu button:hover, .menu button[aria-current] { background: var(--line); }
  .menu img { width: 20px; height: 20px; border-radius: 5px; }
  #org summary { cursor: pointer; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--edge); overflow: hidden; background: #000; }
  #org summary img { width: 100%; height: 100%; display: block; }
  #repo summary { background: transparent; font-weight: 600; font-size: 15px; }
  #repo .org { color: var(--muted); font-weight: 500; } #repo .sep { color: var(--dim); }
  #token .menu { left: auto; right: 0; padding: 12px; gap: 8px; }
  #token input { min-height: 40px; padding: 0 10px; background: var(--bg); border: 1px solid var(--edge); border-radius: 8px; }
  #token .menu button { justify-content: center; background: var(--accent); color: #0D1117; font-weight: 600; }
  .spacer { flex: 1 1 auto; }
  #period { appearance: auto; }
  #status { color: var(--muted); font-size: 13px; }
  #refresh { width: 40px; justify-content: center; padding: 0; }

  main.wrap { padding-top: 32px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 32px; }
  .hello { display: flex; align-items: center; gap: 16px; }
  .hello img { width: 52px; height: 52px; border-radius: 999px; }
  .hello h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .stats .wide { grid-column: span 2; display: flex; flex-direction: column; gap: 16px; }
  @media (max-width: 480px) { .stats .wide { grid-column: auto; } }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 16px; }
  figure.card { margin: 0; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 170px; border-bottom: 1px solid var(--edge); padding: 0 4px; }
  .bar { flex: 1 1 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; position: relative; outline: none; }
  .bar div { width: 26px; max-width: 100%; }
  .xlabels { display: flex; gap: 10px; padding: 0 4px; margin-top: -6px; } .xlabels span { flex: 1 1 0; text-align: center; font-size: 11px; color: var(--muted); }
  .tip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -6px); background: var(--bg); border: 1px solid var(--edge); border-radius: 6px;
    padding: 8px 10px; font-size: 12px; line-height: 1.5; white-space: nowrap; z-index: 2; }
  .bar:hover .tip, .bar:focus .tip, .hrow:hover .tip, .hrow:focus .tip { display: block; }
  .hrow { display: flex; align-items: center; gap: 10px; font-size: 12px; position: relative; outline: none; }
  .split { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .prs { flex: 999 1 560px; padding: 0; overflow: hidden; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .head a, .board-head a { font-size: 13px; color: var(--link); }
  .prrow { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid #1C222B; min-width: 560px; }
  .prrow:hover { background: #1A2029; }
  .prrow > a { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  aside .card { padding: 18px 20px; }
  .mini { display: grid; gap: 12px; } .mini .mono { font-size: 22px; font-weight: 600; } .mini .muted { font-size: 12px; }
  .board-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; align-items: start; }
  .col { background: var(--well); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 2px; font-weight: 600; font-size: 13px; }
  .issue { display: flex; flex-direction: column; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; line-height: 1.4; font-size: 13px; }
  .issue:hover { border-color: #3A4452; }
  .issue[draggable] { cursor: grab; } .issue.dragging { opacity: .4; }
  .col.over { border-color: var(--accent); background: #132036; }
  .col { min-height: 80px; }
  #issue-search { width: 100%; box-sizing: border-box; min-height: 40px; padding: 0 12px; margin-bottom: 14px; background: var(--card); border: 1px solid var(--edge); border-radius: 8px; }
  .results { display: grid; gap: 8px; margin-bottom: 14px; }
  .results .issue { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header><div class="wrap">
  <details id="org" class="picker"><summary aria-label="Pick organization"></summary><div class="menu"></div></details>
  <details id="repo" class="picker"><summary class="ctl" aria-label="Pick repository"></summary><div class="menu"></div></details>
  <div class="spacer"></div>
  <select id="period" class="ctl" aria-label="Period"></select>
  <span id="status"></span>
  <button id="refresh" type="button" class="ctl" aria-label="Refresh data"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  <details id="token" class="picker"><summary class="ctl"><span class="dot"></span><span id="tokenlabel">Connect GitHub token</span></summary>
    <form id="cfg" class="menu">
      <label for="tok" class="label">Personal access token</label>
      <input id="tok" name="token" type="password" autocomplete="off" required>
      <button>Save token</button>
    </form>
  </details>
</div></header>
<main id="app" class="wrap"><p class="empty">Connect a GitHub token to see your stats.</p></main>
<script type="module" src="/main.js"></script>
</body>
</html>
